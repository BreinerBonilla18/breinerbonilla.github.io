<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breiner Bonilla - Fullstack Software Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <header class="max-w-5xl mx-auto px-6 py-20 min-h-[50vh] flex flex-col justify-center">
        <span class="text-indigo-400 font-mono text-sm tracking-wider uppercase mb-2">Portafolio Profesional</span>
        <h1 id="user-name" class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-4"></h1>
        <h2 id="user-title" class="text-xl sm:text-2xl font-medium text-slate-400 mb-6"></h2>
        <p id="user-summary" class="text-slate-300 max-w-2xl text-lg leading-relaxed mb-8"></p>
        <div id="user-links" class="flex gap-4"></div>
    </header>

    <main class="max-w-5xl mx-auto px-6 space-y-20 pb-20">
        <!-- EXPERIENCIA LABORAL -->
        <section>
            <h3 class="text-2xl font-bold text-white mb-6 border-b border-slate-800 pb-3">Experiencia Laboral</h3>
            <div id="experience-container" class="space-y-6"></div>
        </section>

        <!-- TECH STACK -->
        <section>
            <h3 class="text-2xl font-bold text-white mb-6 border-b border-slate-800 pb-3">Habilidades Técnicas</h3>
            <div id="skills-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <!-- PROYECTOS -->
        <section>
            <h3 class="text-2xl font-bold text-white mb-6 border-b border-slate-800 pb-3">Proyectos Destacados</h3>
            <div id="projects-container" class="grid grid-cols-1 gap-10"></div>
        </section>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
